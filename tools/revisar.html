<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Revisão das fotos</title>
<style>
  body{margin:0;padding:8px;background:#111;color:#fff;font:700 13px system-ui}
  .g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  figure{margin:0;background:#222;border-radius:8px;overflow:hidden}
  img{width:100%;height:210px;object-fit:cover;display:block;background:#333}
  figcaption{padding:4px 6px;font-size:12px}
  .flor{color:#8ef}
  .fruto{color:#fd8}
  h2{margin:6px 0;font-size:14px;color:#9f9}
</style>
</head>
<body>
<h2 id="t"></h2>
<div class="g" id="g"></div>
<script>
const IDS = ['maracuja','morango','laranja','goiaba','pitaya','manga','banana','abacaxi','mamao',
 'cacau','jabuticaba','caju','melancia','uva','abacate','roma','maca','pessego','cereja','acerola',
 'pera','figo','melao','coco','acai','graviola'];
const pag = parseInt(location.hash.slice(1) || '0', 10);
const porPag = 3;                       // 3 especies = 6 fotos por tela
const fatia = IDS.slice(pag*porPag, pag*porPag+porPag);
document.getElementById('t').textContent = 'Página ' + pag + ' — ' + fatia.join(', ');
document.getElementById('g').innerHTML = fatia.map(id =>
  ['flor','fruto'].map(t =>
    '<figure><img src="../assets/fotos/'+id+'-'+t+'.jpg" alt=""><figcaption class="'+t+'">'+
    id+' · '+t.toUpperCase()+'</figcaption></figure>'
  ).join('')
).join('');
</script>
</body>
</html>
